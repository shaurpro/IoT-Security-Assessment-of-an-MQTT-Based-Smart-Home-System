# =============================================================================
# HARDENED Mosquitto configuration  (the remediation)
# -----------------------------------------------------------------------------
# Applies the three mitigations validated in the report:
#   1. Encrypted transport  -> TLS listener on 8883, plaintext 1883 disabled.
#   2. Strong authentication -> anonymous rejected, password file required.
#   3. Topic-level access control -> per-identity ACL enforcing least privilege.
#
# Before starting with this config you must generate certs and a password file:
#   bash config/mosquitto/certs/generate_certs.sh
#   bash scripts/make_passwords.sh
# =============================================================================

# ---- Encrypted listener only (no plaintext) ----
listener 8883 0.0.0.0
protocol mqtt

cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
# Require the broker to present a cert; clients verify it against the lab CA.
# (Mutual TLS with require_certificate true is discussed in the report as a
#  further hardening step.)

# ---- Authentication ----
allow_anonymous false
password_file /mosquitto/config/passwordfile

# ---- Authorization (least privilege per device role) ----
acl_file /mosquitto/config/aclfile

persistence false
log_dest stdout
log_type all
