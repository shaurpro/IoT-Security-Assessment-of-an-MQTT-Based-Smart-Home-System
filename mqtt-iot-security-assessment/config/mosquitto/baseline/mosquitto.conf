# =============================================================================
# BASELINE (INTENTIONALLY INSECURE) Mosquitto configuration
# -----------------------------------------------------------------------------
# This represents the typical "it just works" default that many smart-home
# deployments ship with. It is the TARGET of the assessment, NOT a recommended
# configuration. Every weakness here is called out in the technical report.
#
# Weaknesses baked in on purpose:
#   * Listens on plaintext 1883 with no TLS  -> traffic is sniffable.
#   * allow_anonymous true                   -> no authentication at all.
#   * No ACL file                            -> any client can pub/sub anything.
# =============================================================================

listener 1883 0.0.0.0

# No authentication: anyone who can reach the port is a trusted client.
allow_anonymous true

# No per-topic authorization is configured (no acl_file), so every connected
# client may publish and subscribe to every topic, including actuator commands.

# Persistence off keeps the lab stateless between runs.
persistence false

log_dest stdout
log_type all
